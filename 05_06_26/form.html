<!DOCTYPE html> 
<html>
<head>
    <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <script src="http://cdn.tailwindcss.com"></script>
   
</head>
<body class="bg-slate-100 p-8 flex justify-center">
    <div class="max-w-sm w-full bg-white p-6 rounded shadow">
        <h1 class="text-xl font-bold mb-6 text-slate-800">Giriş Yap</h1>
        <form class="space-y-4">
            <div>
                        <label class="text-xs text-slate-600 bloc mb-1" for="eposta">E-posta:</label>
                        <input class="w-full border p-2 rounded text-sm focus:outline-none focus:border-blue-500" type="email" id="eposta" required>
                    </div>
                    <div class="form-grup">
                        <label class="text-xs text-slate-600 bloc mb-1" for="sifre">Şifre:</label>
                        <input class="w-full border p-2 rounded text-sm focus:outline-none focus:border-blue-500" type="password" id="sifre" required>
                    </div>
                    
                    <button class="w-full bg-blue-500 text-white font-semibold py-2 rounded hover:bg-blue-600" type="submit">Gönder</button>
        </form>
    </div>


</body>
</html>
