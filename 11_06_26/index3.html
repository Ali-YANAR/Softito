<!doctype html>
<html lang="tr">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/tailwindcss/2.2.19/tailwind.css" />
    <script src="https://cdnjs.cloudflare.com/ajax/libs/typescript/5.0.4/typescript.min.js"></script>
</head>

<body class="p-6 bg-gray-200">
    <div class="p-6 bg-white">
        <h1 class="text-xl font-bold">Fonksiyonlarda Tipoler</h1>
        <div class="mb-2">
            <input id="num1" type="number" value="10" class="pl-1 border">
        </div>
        <div class="mb-2">
            <button id="btn-add" class="p-2 bg-blue-200">Topla </button>>
            <button id="btn-mult" class="p-2 bg-green-200">Çarp </button>>
        </div>
        <div id="result">HEsapslama yapılmadı</div>
    </div>
    <script>
        window.addEventListener("DOMContentLoaded", () => {
            document
                .querySelectorAll('script[type="text/typescript"]')
                .forEach((script) => {
                    const js = window.ts.transpile(script.textContent);
                    const newScript = document.createElement("script");
                    newScript.textContent = js;
                    document.body.appendChild(newScript);
                });
        });
    </script>
</body>

</html>
