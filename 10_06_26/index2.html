   <!DOCTYPE html>
   <html lang="en">
   <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
       <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/tailwindcss/2.2.19/tailwind.css" />

   </head>
   <body class="p-6 bg-gray-200 items-center justify-center gap-3">
       <div class="p-6 bg-blue">
           <h3 class="text-xs font-semibold">Kullanici sorgula</h3>
       <div class="mb-3">
           <input type="number" id="user-id" placeholder="Kullanici ID(1-3)" value="25" class="p-2 border" />
       </div>
       <button id="btn-search" class="p-2 bg-green-200">Kullanıcı sorgula</button>
       <div id="result" class="mt-3 p-4"> sorgulama yapılmadı </div>
           Sonuç: <span id="output" class="font-bold"></span>
       </div>

         <script>
            //asenkron veri sorgulama işlemi için callback fonksiyonu
              const kullaniciSorgula = (id, onSuccess, onError) => {
                 setTimeout(() => {
                     const veriTabani = {
                         1: { ad: 'Ahmet', yas: 30 },
                         2: { ad: 'Ayşe', yas: 25 },
                         3: { ad: 'Mehmet', yas: 35 }
                     };
                     const kullanici = veriTabani[id];
                     if (kullanici) {
                         onSuccess(kullanici);
                     } else {
                         onError('Hata : Girilen ID(' + id + ') için kullanıcı bulunamadı.');
                     }
                 }, 1500);

              }

                 document.getElementById('btn-search').addEventListener('click', () => {  
                     const output = document.getElementById('result');
                     const id = document.getElementById('user-id').value;
                     output.innerText = 'Sorgulanıyor...';
                     output.className = 'mt-4 p-2';

                     kullaniciSorgula(id, 
                         (kullanici) => {
                            output.className = 'mt-4 bg-green-200';
                             output.innerHTML = `Kullanıcı: ${kullanici.ad}, Yaş: ${kullanici.rol}`;

                         },
                         (hataMesaji) => {
                            output.className = 'mt-4 bg-red-200';
                             output.innerText = hataMesaji;
                         }
                        );
                 }); 
        
        </script>
   </body>
   </html>
