<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/tailwindcss/2.2.19/tailwind.css" />
</head>

<body class="p-6 bg-gray-100">
    <div class="p-6 bg-white">
        <h1 class="text-xl font-bold">Async /Await</h1>
        <button id="btn-run" class="p-2 bg-pink-200">Siparişi Getir</button>
        <div id="result" class="mt-4 whitespace-pre-line">İşlem Bekleniyor............</div>

    </div>
    <script>
        const kullaniciGetir = () => {
            return new Promise((resolve) => {
                setTimeout(() => resolve({
                    id: 42, ad: 'onur'
                }), 1000)
            })
        }
        const sepetiGetir = (kullanici) => {
            return new Promise((resolve) => {
                setTimeout(() => resolve({sahip: kullanici.ad, urunler: ['cep telefonu', 'macbook'] }), 1000);
            })
        }

        const faturaHesapla=(sepet)=>{
            return new Promise((resolve)=>{
                setTimeout(() =>resolve(`Musteri:${sepet.sahip}\nürünler:${sepet.urunler.join(', ')}\nfarura turarı 2500 tl`), 1000);
            })
        }

        const siparisSureciniTonet=async()=>{
            const output = document.getElementById('result');
            output.innerText='süreç başladı....';

            const kullanici = await kullaniciGetir();
            output.innerText=`Kullanıcı alındı:${kullanici.ad}\n sepet yukleniyor`;

            const sepet = await sepetiGetir(kullanici);
            output.innerText=`sepet alındı:${sepet.urunler.join(', ')}\nFaruta hazırlanıyor`;

            const fatura=await faturaHesapla(sepet);
            output.innerText=fatura;

        }

        document.getElementById('btn-run').addEventListener('click', siparisSureciniTonet())


    </script>

</body>

</html>
