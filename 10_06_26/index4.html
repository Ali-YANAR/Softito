<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
        <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/tailwindcss/2.2.19/tailwind.css" />

</head>
<body class="p-6 bg-gray-100">
    <div class="p-6 bg-wihe">
        <h1 class="text-xl font-bold">Veri akışı zincirleme</h1>
        <button id="btn-start" class="bg-green-200">Siparişi Detaylandır</button>
        <div id="result" class="mt-4 whitespace-pre-line">işlem başlatılmadı</div> 
    </div>
    <script>

        const kullaniciyiGetir=()=>{
            return new Promise((resolve)=>{
                setTimeout(() => {
                    resolve({id:42,ad:'onur',uyelik:'Standart'})
                }, 2000);
            })
        }

        const sepetiGetir=(kullanici)=>{
            return new Promise((resolve)=>{
                setTimeout(()=>{resolve({
                    sahip:kullanici.ad,
                    urunler:['akıllı saat','rimel']
                })
                },1000)
            })
        }

        const faturaHesapla=(sepet)=>{
            return new Promise((resolve)=>{
                setTimeout(() => {
                    resolve(`Müşrteri:${sepet.sahip}\nürünler:${sepet.urunler.join(', ')}\nFatura tutari 2350 tl (kargo bedava)`)
                }, 2000);
            })
        }

        document.getElementById('btn-start').addEventListener('click',()=>{
            const output =document.getElementById('result');
            output.innerText="müşteri sorgulanıyor";

            kullaniciyiGetir().then((kullanici)=>{
                output.innerText=`Müşeteri bulundu: ${kullanici.ad}\nSepet aranıyor.....`;
                return sepetiGetir(kullanici);
            }).then((sepet)=>{
                output.innerText=`sepet alındı:${sepet.urunler.join(', ')}\n Fatura hesaplanıyor....`;
                return faturaHesapla(sepet);
            }).then((faturaOzeti)=>{
                output.innerText=faturaOzeti;
            })
        })
        
    </script>
</body>
</html>
