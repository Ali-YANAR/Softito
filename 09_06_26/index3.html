<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/tailwindcss/2.2.19/tailwind.css" />

</head>
<body>
    <div>
        <h1>Property ve method </h1>
        <p></p>
    </div>
    <div>
        <h3>Nesne Olusturma</h3>
        <div>
            <label>Marka</label>
            <input type="text" id="input-brand" value="apple">
        </div>
        <div>
            <label>Fiyat</label>
            <input type="number" id="input-price" value="50000">
        </div>
    </div>
    <div>
        <button style="border:3px;" id="btn-build">Oluştur</button>
        <div id="result">Oluşturulmadı</div>
    </div>
    <script>
        document.getElementById('btn-build').addEventListener('click',()=>{
            const marka = document.getElementById('input-brand').value;
            const fiyat = document.getElementById('input-price').value;

            const cihaz = {
                marka,fiyat,bilgi(){
                    return `${this.marka} markalı cihaz, ${this.fiyat} tl fiyatındadır.`;
                }
            }

            document.getElementById('result').innerHTML=`
            <div>Oluşan Nesne:${JSON.stringify({marka:cihaz.marka, fiyat:cihaz.cihaz})}</div>
            <div>cihaz.bilgi() sonucu:<span>${cihaz.bilgi()}</span></div>`;
        })
    </script>
</body>
</html>
